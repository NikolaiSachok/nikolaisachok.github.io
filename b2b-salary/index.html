<!DOCTYPE html>
<!-- Hand-authored, NOT generated. build.py owns index.html and the locale pages
     only; this utility page is self-contained and carries its own EN/SK copy,
     palette and chrome. See README ("The B2B ↔ salary page"). -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>B2B rate → employment salary · Slovakia 2026</title>
<meta name="description" content="An interactive, sourced model that converts a Slovak self-employed (živnosť / B2B) rate into the equivalent employee gross salary — matched on take-home pay and on total package value. Fiscal year 2026.">
<meta name="author" content="Nikolai Sachok">
<link rel="canonical" href="https://nikolaisachok.com/b2b-salary/">

<!-- The page is sent as a link, most often pasted into a message — so the
     unfurl is part of the artefact, not an afterthought. -->
<meta property="og:type" content="website">
<meta property="og:title" content="B2B rate → employment salary · Slovakia 2026">
<meta property="og:description" content="Converts a Slovak živnosť / B2B rate into the equivalent employee gross salary — matched on take-home pay and on total package value, with the legislation it derives from.">
<meta property="og:url" content="https://nikolaisachok.com/b2b-salary/">
<meta property="og:locale" content="en_US">
<meta property="og:locale:alternate" content="sk_SK">
<meta name="twitter:card" content="summary">

<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E2%9A%A1%3C/text%3E%3C/svg%3E">

<style>
  /* Theme in three states, the same contract as the rest of the site — and the
     same storage key (`nls-theme`), so a choice made on the landing page is
     still in force here.

       1. data-theme="light" | "dark" on <html> — an explicit choice, stored in
          localStorage and applied by the head script below before first paint.
       2. no attribute + prefers-color-scheme — the visitor's system setting.
       3. no attribute, no preference — light.

     Every colour is written ONCE as --light-* / --dark-*; the rules below only
     re-point the working tokens at one set or the other, so a palette edit is
     one edit and the two themes cannot drift apart.

     Each band of the bars and charts carries a SECOND token, --<band>-on: the
     colour of the value label sitting inside it. A single white was wrong on
     the pale grey bands in light mode (2.9:1) and wrong on nearly all of them
     once the ramp inverts for dark, so the pairing is per band. */
  :root{
    --light-paper:#F7F7F5; --light-card:#FFFFFF;
    --light-ink:#1A1F26;   --light-ink2:#3A424C;
    /* The grey ramp is 4.5:1+ on white throughout: every use of these two is
       small text — eyebrow, axis labels, section numbers, table headers — and
       the ramp as first drawn sat at 3.1:1 (faint) and 4.0:1 (mute). */
    --light-mute:#545D69;  --light-faint:#6E7783;
    --light-hair:#E5E7EA;  --light-hair2:#EEEFF1;
    --light-topbar:rgba(247,247,245,.86);
    --light-shadow:0 1px 2px rgba(26,31,38,.04),0 10px 30px rgba(26,31,38,.06);
    --light-b2b:#0F7A63;   --light-emp:#34518F;
    --light-net:#1A1F26;   --light-net-on:#FFFFFF;
    --light-tax:#C07949;   --light-tax-on:#1F2630;
    --light-soc:#8A97A6;   --light-soc-on:#1F2630;
    --light-hea:#C3CCD6;   --light-hea-on:#1F2630;
    --light-off:#57977E;   --light-off-on:#0E241B;
    --light-cost:#C3CCD5;  --light-cost-on:#42505F;

    /* Dark inverts the ramp: in light, "net" is the near-black band and health
       the palest; in dark, net is the lightest and health sits closest to the
       page. That is why the on-colours flip partway down the list. */
    --dark-paper:#13161B;  --dark-card:#1B2027;
    --dark-ink:#E6E9ED;    --dark-ink2:#C4CCD6;
    --dark-mute:#9AA4B0;   --dark-faint:#8A939F;
    --dark-hair:#2B323B;   --dark-hair2:#232931;
    --dark-topbar:rgba(19,22,27,.86);
    --dark-shadow:0 1px 2px rgba(0,0,0,.5),0 10px 30px rgba(0,0,0,.35);
    --dark-b2b:#3FC29E;    --dark-emp:#8AA8EC;
    --dark-net:#DCE3EA;    --dark-net-on:#14181E;
    --dark-tax:#D2914F;    --dark-tax-on:#241706;
    --dark-soc:#7D8A99;    --dark-soc-on:#141920;
    --dark-hea:#4C5665;    --dark-hea-on:#DCE3EA;
    --dark-off:#5FB398;    --dark-off-on:#0E2219;
    --dark-cost:#57616F;   --dark-cost-on:#E3E9EF;

    --paper:var(--light-paper); --card:var(--light-card);
    --ink:var(--light-ink); --ink2:var(--light-ink2);
    --mute:var(--light-mute); --faint:var(--light-faint);
    --hair:var(--light-hair); --hair2:var(--light-hair2);
    --topbar:var(--light-topbar); --shadow:var(--light-shadow);
    --b2b:var(--light-b2b); --emp:var(--light-emp);
    --net:var(--light-net); --net-on:var(--light-net-on);
    --tax:var(--light-tax); --tax-on:var(--light-tax-on);
    --soc:var(--light-soc); --soc-on:var(--light-soc-on);
    --hea:var(--light-hea); --hea-on:var(--light-hea-on);
    --off:var(--light-off); --off-on:var(--light-off-on);
    --cost:var(--light-cost); --cost-on:var(--light-cost-on);
    color-scheme:light;

    --serif:ui-serif,Georgia,"Times New Roman",serif;
    --sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    --mono:ui-monospace,SFMono-Regular,Menlo,"Cascadia Code",monospace;
  }

  @media(prefers-color-scheme:dark){
    :root:not([data-theme="light"]){
      --paper:var(--dark-paper); --card:var(--dark-card);
      --ink:var(--dark-ink); --ink2:var(--dark-ink2);
      --mute:var(--dark-mute); --faint:var(--dark-faint);
      --hair:var(--dark-hair); --hair2:var(--dark-hair2);
      --topbar:var(--dark-topbar); --shadow:var(--dark-shadow);
      --b2b:var(--dark-b2b); --emp:var(--dark-emp);
      --net:var(--dark-net); --net-on:var(--dark-net-on);
      --tax:var(--dark-tax); --tax-on:var(--dark-tax-on);
      --soc:var(--dark-soc); --soc-on:var(--dark-soc-on);
      --hea:var(--dark-hea); --hea-on:var(--dark-hea-on);
      --off:var(--dark-off); --off-on:var(--dark-off-on);
      --cost:var(--dark-cost); --cost-on:var(--dark-cost-on);
      color-scheme:dark;
    }
  }

  :root[data-theme="dark"]{
    --paper:var(--dark-paper); --card:var(--dark-card);
    --ink:var(--dark-ink); --ink2:var(--dark-ink2);
    --mute:var(--dark-mute); --faint:var(--dark-faint);
    --hair:var(--dark-hair); --hair2:var(--dark-hair2);
    --topbar:var(--dark-topbar); --shadow:var(--dark-shadow);
    --b2b:var(--dark-b2b); --emp:var(--dark-emp);
    --net:var(--dark-net); --net-on:var(--dark-net-on);
    --tax:var(--dark-tax); --tax-on:var(--dark-tax-on);
    --soc:var(--dark-soc); --soc-on:var(--dark-soc-on);
    --hea:var(--dark-hea); --hea-on:var(--dark-hea-on);
    --off:var(--dark-off); --off-on:var(--dark-off-on);
    --cost:var(--dark-cost); --cost-on:var(--dark-cost-on);
    color-scheme:dark;
  }

  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);line-height:1.55;font-size:15px}
  .wrap{max-width:1080px;margin:0 auto;padding:0 22px}
  .mono{font-family:var(--mono);font-variant-numeric:tabular-nums}

  /* top bar */
  .topbar{position:sticky;top:0;z-index:20;background:var(--topbar);backdrop-filter:saturate(180%) blur(10px);border-bottom:1px solid var(--hair)}
  .topbar .row{display:flex;align-items:center;justify-content:space-between;gap:12px;height:54px}

  /* The way back to the site. It replaces the standing "Fiscal note · Slovakia
     FY 2026" marker that used to sit here, which the eyebrow below repeats
     almost word for word — so the space was spent on a duplicate, and a visitor
     arriving from a pasted link had no way home. */
  .home{display:inline-flex;align-items:center;gap:8px;font-family:var(--mono);font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);text-decoration:none;white-space:nowrap}
  .home b{color:var(--ink);font-weight:600}
  .home .ar{font-size:14px;letter-spacing:0;transition:transform .15s}
  .home:hover b{color:var(--b2b)}
  .home:hover .ar{transform:translateX(-3px)}

  .chrome{display:flex;align-items:stretch;gap:8px;height:32px}
  .lang{display:inline-flex;border:1px solid var(--hair);border-radius:8px;overflow:hidden;background:var(--card)}
  .lang button{border:0;background:transparent;font:inherit;font-size:12.5px;font-weight:600;color:var(--mute);padding:0 12px;cursor:pointer;letter-spacing:.02em}
  .lang button.on{background:var(--ink);color:var(--paper)}
  .themebtn{display:inline-flex;align-items:center;justify-content:center;width:34px;padding:0;border:1px solid var(--hair);border-radius:8px;background:var(--card);color:var(--mute);cursor:pointer}
  .themebtn:hover{color:var(--ink);border-color:var(--faint)}
  .themebtn svg{display:none;width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
  .themebtn .icon-fill{fill:currentColor;stroke:none}
  html:not([data-theme]) .themebtn .icon-auto,
  html[data-theme="light"] .themebtn .icon-light,
  html[data-theme="dark"] .themebtn .icon-dark{display:block}

  /* masthead */
  header.mast{padding:44px 0 26px;border-bottom:1px solid var(--hair)}
  .eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.15em;text-transform:uppercase;color:var(--faint);margin-bottom:14px}
  h1{font-family:var(--serif);font-weight:600;font-size:clamp(30px,5vw,46px);line-height:1.06;letter-spacing:-.01em;margin:0 0 14px}
  .deck{font-size:16.5px;color:var(--ink2);max-width:70ch;margin:0 0 10px}
  .metaline{font-size:13px;color:var(--mute);font-style:italic}

  section{padding:34px 0;border-bottom:1px solid var(--hair)}
  .sechead{display:flex;align-items:baseline;gap:12px;margin-bottom:18px}
  .secno{font-family:var(--mono);font-size:12px;color:var(--faint);letter-spacing:.08em}
  h2{font-family:var(--serif);font-weight:600;font-size:22px;margin:0;letter-spacing:-.01em}
  .lead{color:var(--mute);font-size:14.5px;max-width:72ch;margin:-6px 0 0}

  .card{background:var(--card);border:1px solid var(--hair);border-radius:14px;box-shadow:var(--shadow)}

  /* orientation */
  .orient{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
  .orient .o{padding:18px 18px 20px}
  .orient .oi{width:26px;height:26px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:12px;font-weight:700;color:var(--paper);margin-bottom:10px}
  .orient h3{font-size:14.5px;margin:0 0 5px;font-weight:650}
  .orient p{margin:0;font-size:13.5px;color:var(--mute);line-height:1.5}

  /* calculator */
  .calc{padding:24px}
  .driver{display:flex;flex-wrap:wrap;gap:18px 26px;align-items:flex-end;justify-content:space-between;margin-bottom:18px}
  .seg{display:inline-flex;background:var(--paper);border:1px solid var(--hair);border-radius:9px;padding:3px}
  .seg button{border:0;background:transparent;font:inherit;font-size:13px;color:var(--mute);padding:7px 13px;border-radius:6px;cursor:pointer;transition:.15s}
  .seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08);font-weight:600}
  .inphead{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:6px}
  .seg.small{padding:2px}
  .seg.small button{padding:5px 10px;font-size:12px}
  .capnote{margin-top:7px;font-size:11.5px;color:var(--faint);font-family:var(--mono)}
  .inp label{display:block;font-size:12.5px;color:var(--mute);margin-bottom:6px}
  .inpline{display:flex;align-items:baseline;gap:8px}
  .inpline .cur{color:var(--mute);font-size:20px}
  .inp input[type=number]{width:158px;font-family:var(--mono);font-size:29px;font-weight:700;border:0;border-bottom:2px solid var(--ink);background:transparent;padding:2px 0;color:var(--ink)}
  .inp input[type=number]:focus{outline:0;border-color:var(--b2b)}
  .permo{color:var(--mute);font-size:14px}
  input[type=range]{width:100%;accent-color:var(--ink);height:4px}
  #rng{margin:12px 0 0}
  .controls{display:grid;grid-template-columns:repeat(3,1fr);gap:16px 24px;margin:20px 0 2px;padding:18px 0 2px;border-top:1px solid var(--hair2)}
  .ctrl .lab{display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:6px}
  .ctrl .lab .k{color:var(--mute)} .ctrl .lab .v{font-family:var(--mono);font-weight:700;color:var(--emp)}
  .ctrl input[type=range]{accent-color:var(--emp)}

  .bars{display:grid;gap:16px;margin-top:22px}
  .barblk .top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:7px;gap:10px}
  .barblk .name{font-weight:650;font-size:14.5px;display:flex;align-items:center;gap:8px}
  .dot{width:9px;height:9px;border-radius:3px;display:inline-block}
  .barblk .big{font-family:var(--mono);font-weight:700;font-size:18px}
  .barblk .big small{font-weight:400;color:var(--mute);font-size:11.5px}
  .track{position:relative;height:38px;border-radius:8px;overflow:hidden;background:var(--paper);display:flex}
  .seg-fill{height:100%;transition:width .35s cubic-bezier(.22,.61,.36,1);position:relative;min-width:0}
  .seg-fill span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:11px;color:inherit;white-space:nowrap}
  .track.ghost{margin-top:5px;height:12px;opacity:.85}
  .legend{display:flex;flex-wrap:wrap;gap:6px 15px;margin-top:14px;font-size:12px;color:var(--mute)}
  .legend span{display:inline-flex;align-items:center;gap:6px}
  .delta{margin-top:18px;padding-top:18px;border-top:1px solid var(--hair2);display:grid;grid-template-columns:repeat(3,1fr);gap:16px 20px}
  .kpi .lab{font-size:12px;color:var(--mute)}
  .kpi .val{font-family:var(--mono);font-weight:700;font-size:18px;margin-top:2px}
  .kpi .val.b2b{color:var(--b2b)} .kpi .val.emp{color:var(--emp)} .kpi .val.off{color:var(--off)}

  /* charts */
  .charts{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  .chart{padding:16px 16px 10px}
  .chart .ct{font-size:14px;font-weight:650;margin:0 0 2px}
  .chart .cs{font-size:12px;color:var(--mute);margin:0 0 6px;min-height:15px}
  .chart svg{display:block;width:100%;height:auto;overflow:visible}
  .axl{font-family:var(--mono);font-size:9.5px;fill:var(--mute)}
  .grid line{stroke:var(--hair2);stroke-width:1}
  .cval{font-family:var(--mono);font-size:10px}

  /* table */
  .tablecard{padding:6px 4px;overflow-x:auto}
  table.data{border-collapse:collapse;width:100%;font-size:13px}
  table.data th,table.data td{padding:9px 12px;text-align:right;white-space:nowrap}
  table.data th{font-family:var(--mono);font-size:10px;letter-spacing:.03em;text-transform:uppercase;color:var(--mute);font-weight:600;border-bottom:1px solid var(--hair);vertical-align:bottom}
  table.data th:first-child,table.data td:first-child{text-align:left}
  table.data td{border-bottom:1px solid var(--hair2);font-family:var(--mono)}

  /* parameters */
  .params{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
  .pgroup{padding:16px 18px}
  .pgroup h4{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);margin:0 0 12px;font-weight:600}
  .prow{display:flex;justify-content:space-between;gap:12px;padding:5px 0;border-top:1px solid var(--hair2);font-size:13px}
  .prow:first-of-type{border-top:0}
  .prow .pk{color:var(--mute)} .prow .pv{font-family:var(--mono);font-weight:600;text-align:right}

  /* legal */
  .legal{display:grid;gap:2px}
  .act{padding:15px 18px;display:grid;grid-template-columns:auto 1fr;gap:4px 16px;align-items:start}
  .act:not(:last-child){border-bottom:1px solid var(--hair2)}
  .act .num{font-family:var(--mono);font-size:12px;color:var(--b2b);font-weight:700;white-space:nowrap;grid-row:span 2}
  .act .nm{font-weight:650;font-size:14px}
  .act .nm a{color:var(--ink);text-decoration:none;border-bottom:1px solid var(--hair)}
  .act .nm a:hover{border-color:var(--b2b);color:var(--b2b)}
  .act .gv{font-size:13px;color:var(--mute);line-height:1.5}

  ul.notes{margin:0;padding:0;list-style:none;display:grid;gap:9px}
  ul.notes li{padding-left:20px;position:relative;font-size:13.5px;color:var(--ink2);line-height:1.55}
  ul.notes li::before{content:"—";position:absolute;left:0;color:var(--faint)}
  ul.notes li b{color:var(--ink);font-weight:600}

  .foot{padding:26px 0 60px;font-size:12.5px;color:var(--mute);line-height:1.6}
  .foot .disc{font-style:italic}
  .foot-home{margin:16px 0 0}
  .foot-home a{color:var(--mute);text-decoration:none;border-bottom:1px solid var(--hair)}
  .foot-home a:hover{color:var(--b2b);border-color:var(--b2b)}

  @media(max-width:760px){
    .orient,.charts,.params,.controls{grid-template-columns:1fr}
    .delta{grid-template-columns:1fr 1fr}
    .wrap{padding:0 15px}
  }
  @media(max-width:430px){
    .home{font-size:10px;letter-spacing:.06em;gap:6px}
    .lang button{padding:0 9px}
  }
  @media(prefers-reduced-motion:reduce){*{transition:none!important}}
  @media print{
    /* Print always uses the light palette. Backgrounds do not print by default,
       so a dark theme would put pale text on white paper. */
    :root{
      --paper:var(--light-paper); --card:var(--light-card);
      --ink:var(--light-ink); --ink2:var(--light-ink2);
      --mute:var(--light-mute); --faint:var(--light-faint);
      --hair:var(--light-hair); --hair2:var(--light-hair2);
      --b2b:var(--light-b2b); --emp:var(--light-emp);
      --net:var(--light-net); --net-on:var(--light-net-on);
      --tax:var(--light-tax); --tax-on:var(--light-tax-on);
      --soc:var(--light-soc); --soc-on:var(--light-soc-on);
      --hea:var(--light-hea); --hea-on:var(--light-hea-on);
      --off:var(--light-off); --off-on:var(--light-off-on);
      --cost:var(--light-cost); --cost-on:var(--light-cost-on);
      color-scheme:light;
    }
    .topbar{position:static} .card{box-shadow:none} body{background:#fff}
    .chrome{display:none}
    section{break-inside:avoid}
  }
</style>

<script>
/* Theme before first paint, so the page never flashes the other palette.
   Shares `nls-theme` with the rest of nikolaisachok.com: no attribute means
   "follow the system", which is the absence of a choice rather than a third
   stored value. */
(function(){
  try{
    var t=null;
    try{t=localStorage.getItem('nls-theme');}catch(e){}
    if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t);
  }catch(e){}
})();
</script>
</head>
<body>

<div class="topbar"><div class="wrap"><div class="row">
  <a class="home" id="home" href="/"><span class="ar" aria-hidden="true">&larr;</span><b data-i18n="home"></b></a>
  <div class="chrome">
    <button type="button" class="themebtn" id="theme">
      <svg class="icon-light" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      <svg class="icon-dark" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      <svg class="icon-auto" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path class="icon-fill" d="M12 3a9 9 0 0 0 0 18z"/></svg>
    </button>
    <div class="lang" id="lang"><button data-l="en" class="on">EN</button><button data-l="sk">SK</button></div>
  </div>
</div></div></div>

<div class="wrap">
  <header class="mast">
    <div class="eyebrow" data-i18n="eyebrow"></div>
    <h1 data-i18n="title"></h1>
    <p class="deck" data-i18n="deck"></p>
    <p class="metaline" data-i18n="metaline"></p>
  </header>

  <!-- 01 orientation -->
  <section>
    <div class="sechead"><span class="secno">01</span><h2 data-i18n="s1_h"></h2></div>
    <div class="orient">

/* ===== Slovakia FY2026 constants ===== */
const NCZD_FULL=5966.73,NCZD_A=14661.11,NCZD_LOW=26083.13;
const B1=43983.32,B2=60349.21,B3=75010.32,MAXSOC=16764,MINSOC=914.40,MINHEA=762,WD=261;
function nczd(b){if(b<=NCZD_LOW)return NCZD_FULL;return Math.max(NCZD_A-b/3,0);}
function prog(t){let x=Math.min(t,B1)*.19;if(t>B1)x+=(Math.min(t,B2)-B1)*.25;if(t>B2)x+=(Math.min(t,B3)-B2)*.30;if(t>B3)x+=(t-B3)*.35;return x;}
function b2b(Rm){const R=Rm*12,P=Math.min(.6*R,20000),VZ=(R-P)/1.486/12;
  const h=Math.max(VZ,MINHEA)*.16,s=Math.min(Math.max(VZ,MINSOC),MAXSOC)*.3315,C=(h+s)*12,tb=R-P-C;
  const taxable=Math.max(tb-nczd(tb),0),tax=(R<=100000?.15*taxable:prog(taxable));
  return {Rm,health:h,social:s,tax:tax/12,net:(R-C-tax)/12};}
function emp(Gm){const G=Gm*12,s=Math.min(Gm,MAXSOC)*12*.094,h=G*.05,od=s+h,tb=G-od,tax=prog(Math.max(tb-nczd(tb),0));
  return {Gm,social:s/12,health:h/12,tax:tax/12,net:(G-od-tax)/12};}
function cena(Gm){const G=Gm*12,cap=Math.min(Gm,MAXSOC)*12;return (G+cap*.244+G*.008+G*.11)/12;}
function pkg(base,bonus,vac,hol){const cg=base*(1+bonus/100),e=emp(cg),off=Math.min(vac+hol,WD-1),ratio=WD/(WD-off);
  const total=e.net*ratio;return {base,cashGross:cg,netCash:e.net,timeoff:total-e.net,total,cena:cena(cg),tax:e.tax,social:e.social,health:e.health};}
function b2bForNet(t){let lo=0,hi=16000;for(let i=0;i<70;i++){const m=(lo+hi)/2;(b2b(m).net<t)?lo=m:hi=m;}return (lo+hi)/2;}
function baseForTotal(t,bonus,vac,hol){let lo=0,hi=40000;for(let i=0;i<70;i++){const m=(lo+hi)/2;(pkg(m,bonus,vac,hol).total<t)?lo=m:hi=m;}return (lo+hi)/2;}

  sk:'<b>B2B je modelované ako živnosť</b> so 60 % paušálnymi výdavkami a minimálnymi reálnymi nákladmi — paušál je daňový odpočet, nie skutočný výdavok, preto sa neodpočítava z čistého príjmu.'},
 {en:'<b>Contributions are shown in steady state.</b> A self-employed person’s actual contributions derive from the prior year’s tax return; the first year differs.',
  sk:'<b>Odvody sú v ustálenom stave.</b> Skutočné odvody SZČO vychádzajú z minuloročného daňového priznania; prvý rok sa líši.'},
 {en:'<b>Standard minimum bases</b> are assumed — not the reduced micro-contribution regime for new or low-income traders.',
  sk:'<b>Predpokladajú sa štandardné minimálne základy</b> — nie znížený mikroodvodový režim pre nových alebo nízkopríjmových živnostníkov.'},
 {en:'<b>The 15 % income-tax rate</b> applies while annual turnover ≤ €100,000; above it, progressive rates apply — the visible step near €8,333/mo.',
  sk:'<b>Sadzba dane 15 %</b> platí, kým ročný obrat ≤ 100 000 €; nad ňou platia progresívne sadzby — viditeľný zlom pri ~8 333 €/mes.'},
 {en:'<b>Employment equivalence</b> is computed on total package value = net cash + monetised value of paid time off (vacation + public holidays), via the factor 261 ÷ (261 − days off).',
  sk:'<b>Rovnocennosť zamestnania</b> sa počíta na celkovej hodnote balíka = čistý príjem + peňažná hodnota plateného voľna (dovolenka + sviatky), cez faktor 261 ÷ (261 − dní voľna).'},
 {en:'<b>Other monetary benefits are NOT included</b> — 3rd-pillar pension, meal allowance, transport, sick-pay top-up. Counting them raises the equivalent B2B figure by a further ~€300–450/mo.',
  sk:'<b>Ostatné peňažné benefity NIE sú zahrnuté</b> — 3. pilier, stravné, doprava, doplatok PN. Ich započítanie zvyšuje ekvivalent B2B o ďalších ~300–450 €/mes.'},
 {en:'<b>Non-taxable base</b> counts only the taxpayer allowance (no spouse/child bonuses). <b>Cena práce</b> = gross + 36.2 % employer contributions.',
  sk:'<b>Nezdaniteľná časť</b> zahŕňa len úľavu na daňovníka (bez bonusov na manžela/deti). <b>Cena práce</b> = hrubá mzda + 36,2 % odvodov zamestnávateľa.'},
];

const FACTOR={hour:168,day:21,month:1};
const CFG={hour:{min:5,maxB:60,maxG:75,step:1},day:{min:40,maxB:480,maxG:600,step:5},month:{min:500,maxB:10000,maxG:12000,step:50}};
let lang='en', mode='b2b', unit='hour';
function reconfig(keepMonthly){const c=CFG[unit],max=(mode==='gross'?c.maxG:c.maxB),num=document.getElementById('num'),rng=document.getElementById('rng');
  num.min=c.min;num.max=max;num.step=c.step;rng.min=c.min;rng.max=max;rng.step=c.step;
  let dv=Math.min(Math.max(keepMonthly/FACTOR[unit],c.min),max);dv=Math.round(dv/c.step)*c.step;num.value=dv;rng.value=dv;}
const S=()=>({bonus:+document.getElementById('bonus').value,vac:+document.getElementById('vac').value,hol:+document.getElementById('hol').value});
const t=k=>T[lang][k];

function applyLang(){
  document.querySelectorAll('[data-i18n]').forEach(el=>{const k=el.getAttribute('data-i18n');if(T[lang][k]!=null)el.innerHTML=T[lang][k];});
  document.querySelectorAll('#lang button').forEach(b=>b.classList.toggle('on',b.dataset.l===lang));
  document.documentElement.lang=lang;
  document.title = lang==='sk' ? 'Z B2B sadzby na hrubú mzdu · Slovensko 2026' : 'B2B rate → employment salary · Slovakia 2026';
  /* Both ways home point at the site in the language being read here. Opening a
     locale path directly is always honoured by the site's own router. */
  ['home','homeFoot'].forEach(id=>document.getElementById(id).setAttribute('href',t('homeHref')));
  document.getElementById('home').setAttribute('aria-label',t('backHome'));
  themeLabel();
  renderParams(); renderLegal(); renderAssum();
  update();
}
function renderParams(){
  document.getElementById('params').innerHTML=PARAMS.map(g=>{
    const rows=g.rows.map(r=>{const k=(typeof r[0]==='object')?r[0][lang]:r[0];const v=(typeof r[1]==='object')?r[1][lang]:r[1];return `<div class="prow"><span class="pk">${k}</span><span class="pv">${v}</span></div>`;}).join('');
    return `<div class="card pgroup"><h4>${t(g.g)}</h4>${rows}</div>`;
  }).join('');
}
function renderLegal(){
  document.getElementById('legal').innerHTML=ACTS.map(a=>
    `<div class="act"><span class="num">${a.num}</span><div class="nm"><a href="${a.url}" target="_blank" rel="noopener">${a.nm[lang]}</a></div><div class="gv">${a.gv[lang]}</div></div>`).join('');
}
function renderAssum(){document.getElementById('assum').innerHTML=ASSUM.map(a=>`<li>${a[lang]}</li>`).join('');}

/* A band's fill and the colour of the value label inside it are one decision,
   so they travel together: seg() takes the band name, not a colour. */
function seg(w,total,band){const p=total>0?Math.max(w/total*100,0):0;
  return `<div class="seg-fill" style="width:${p}%;background:var(--${band});color:var(--${band}-on)">${p>12?`<span>${eur(w)}</span>`:''}</div>`;}

function update(){
  const s=S();
  document.getElementById('vBonus').textContent=s.bonus+' %';
  document.getElementById('vVac').textContent=s.vac;
  document.getElementById('vHol').textContent=s.hol;
  const uw=t('perU_'+unit);
  document.getElementById('inLabel').textContent=(mode==='b2b'?t('inLabelB2b'):t('inLabelGross'))+' — €/'+uw;
  document.getElementById('permo').textContent=t('permoU_'+unit);
  document.querySelectorAll('#unit button').forEach(b=>b.classList.toggle('on',b.dataset.u===unit));
  const val=(+document.getElementById('num').value||0)*FACTOR[unit];
  document.getElementById('capNote').textContent = unit==='month' ? '' : t('cap').replace('{m}',eur(val));
  let Rm,base;
  if(mode==='b2b'){Rm=val;const bNet=b2b(Rm).net;base=baseForTotal(bNet,s.bonus,s.vac,s.hol);}
  else{base=val;Rm=b2bForNet(pkg(base,s.bonus,s.vac,s.hol).total);}
  const b=b2b(Rm),P=pkg(base,s.bonus,s.vac,s.hol);

  document.getElementById('b2bHead').innerHTML=`${eur(Rm)} <small>${t('headInvoice')}</small>`;
  document.getElementById('empHead').innerHTML=`${eur(base)} <small>${t('headGross').replace('{b}',s.bonus)}</small>`;
  document.getElementById('b2bTrack').innerHTML=seg(b.net,Rm,'net')+seg(b.tax,Rm,'tax')+seg(b.social,Rm,'soc')+seg(b.health,Rm,'hea');
  const eTot=P.cashGross+P.timeoff;
  document.getElementById('empTrack').innerHTML=seg(P.netCash,eTot,'net')+seg(P.tax,eTot,'tax')+seg(P.social,eTot,'soc')+seg(P.health,eTot,'hea')+seg(P.timeoff,eTot,'off');
  const topup=P.cena-P.cashGross;
  document.getElementById('costTrack').innerHTML=`<div class="seg-fill" style="width:${P.cashGross/P.cena*100}%;background:transparent"></div><div class="seg-fill" style="width:${topup/P.cena*100}%;background:var(--cost);color:var(--cost-on)"><span>+${eur(topup)} ${t('employer')}</span></div>`;

  document.getElementById('legend').innerHTML=[['--net','legNet'],['--off','legOff'],['--tax','legTax'],['--soc','legSoc'],['--hea','legHea'],['--cost','legCost']].map(([c,k])=>`<span><span class="dot" style="background:var(${c})"></span>${t(k)}</span>`).join('');

  document.getElementById('kInv').textContent=eur(Rm);
  document.getElementById('kBase').textContent=eur(base);
  document.getElementById('kCash').textContent=eur(P.netCash);
  document.getElementById('kOff').textContent='+'+eur(P.timeoff);
  document.getElementById('kTotal').textContent=eur(P.total);
  document.getElementById('kCost').textContent=eur(P.cena);
  drawCharts(s); buildTable(s);
}

/* charts */
const W=430,H=250,M={t:14,r:16,b:30,l:46},iw=W-M.l-M.r,ih=H-M.t-M.b,N=70;
function frame(xmax,ymax,xlabel,yfmt,nx){let s=`<svg viewBox="0 0 ${W} ${H}"><g class="grid">`;
  for(let i=0;i<=4;i++){const y=M.t+ih-ih*i/4;s+=`<line x1="${M.l}" y1="${y}" x2="${W-M.r}" y2="${y}"/><text class="axl" x="${M.l-6}" y="${y+3}" text-anchor="end">${yfmt(ymax*i/4)}</text>`;}
  for(let i=0;i<=(nx||5);i++){const x=M.l+iw*i/(nx||5),v=xmax*i/(nx||5);s+=`<text class="axl" x="${x}" y="${H-M.b+16}" text-anchor="middle">${(v/1000).toFixed(v>0&&v<1000?1:0)}k</text>`;}
  s+=`</g><text class="axl" x="${M.l+iw/2}" y="${H-2}" text-anchor="middle">${xlabel}</text>`;return s;}
const X=(v,m)=>M.l+iw*v/m,Y=(v,m)=>M.t+ih-ih*v/m;
function area(pts,c,o){const u=pts.map(p=>`${p[0].toFixed(1)},${p[1].toFixed(1)}`).join(' '),d=pts.slice().reverse().map(p=>`${p[0].toFixed(1)},${p[2].toFixed(1)}`).join(' ');return `<polygon points="${u} ${d}" fill="${c}" opacity="${o||1}"/>`;}
function ln(pts,c,dash,w){return `<polyline points="${pts.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ')}" fill="none" stroke="${c}" stroke-width="${w||2}" ${dash?`stroke-dasharray="${dash}"`:''} stroke-linejoin="round"/>`;}
function drawCharts(s){
  const xmax=10000;
  {let g=frame(xmax,10000,t('axB2b'),v=>(v/1000)+'k');const bands=[['net','var(--net)'],['tax','var(--tax)'],['social','var(--soc)'],['health','var(--hea)']];
   const D=[];for(let i=0;i<=N;i++){const Rm=xmax*i/N;D.push([Rm,b2b(Rm)]);}let bs=D.map(()=>0);
   bands.forEach(([k,c])=>{const sg=D.map((p,i)=>{const lo=bs[i],hi=bs[i]+p[1][k];return [X(p[0],xmax),Y(hi,10000),Y(lo,10000)];});g+=area(sg,c,.96);bs=bs.map((v,i)=>v+D[i][1][k]);});
   g+='</svg>';document.getElementById('cA').innerHTML=g;}
  {const ym=12000;let g=frame(xmax,ym,t('axB2b'),v=>(v/1000)+'k');const wit=[],csh=[],cst=[];
   for(let i=0;i<=N;i++){const Rm=xmax*i/N,bNet=b2b(Rm).net,bw=baseForTotal(bNet,s.bonus,s.vac,s.hol),bc=baseForTotal(bNet,0,0,0);
     wit.push([X(Rm,xmax),Y(bw,ym)]);csh.push([X(Rm,xmax),Y(bc,ym)]);cst.push([X(Rm,xmax),Y(cena(bw*(1+s.bonus/100)),ym)]);}
   g+=ln(cst,'var(--cost)','',2)+ln(csh,'var(--mute)','4 3',1.4)+ln(wit,'var(--emp)','',2.6);
   g+=`<text class="cval" x="${W-M.r}" y="${Y(cena(baseForTotal(b2b(9600).net,s.bonus,s.vac,s.hol)*(1+s.bonus/100)),ym)-4}" text-anchor="end" fill="var(--faint)">${t('cenaPrace')}</text>`;
   g+='</svg>';document.getElementById('cB').innerHTML=g;}
  {const xm=12000;let g=frame(xm,12000,t('axGross'),v=>(v/1000)+'k',6);const bands=[['net','var(--net)'],['tax','var(--tax)'],['social','var(--soc)'],['health','var(--hea)']];
   const D=[];for(let i=0;i<=N;i++){const Gm=xm*i/N;D.push([Gm,emp(Gm)]);}let bs=D.map(()=>0);
   bands.forEach(([k,c])=>{const sg=D.map((p,i)=>{const lo=bs[i],hi=bs[i]+p[1][k];return [X(p[0],xm),Y(hi,12000),Y(lo,12000)];});g+=area(sg,c,.96);bs=bs.map((v,i)=>v+D[i][1][k]);});
   g+='</svg>';document.getElementById('cC').innerHTML=g;}
  {const ym=4000;let g=frame(xmax,ym,t('axB2b'),v=>(v/1000).toFixed(1)+'k');const pts=[];
   for(let i=0;i<=N;i++){const Rm=xmax*i/N,bNet=b2b(Rm).net,gap=baseForTotal(bNet,0,0,0)-baseForTotal(bNet,s.bonus,s.vac,s.hol);pts.push([X(Rm,xmax),Y(Math.max(gap,0),ym),Y(0,ym)]);}
   g+=area(pts,'var(--off)',.9)+ln(pts.map(p=>[p[0],p[1]]),'var(--off)','',2);g+='</svg>';document.getElementById('cD').innerHTML=g;}
}
function buildTable(s){
  const rows=[1000,2000,3000,4000,5000,6000,7000,8000,9000,10000];
  const h=`<thead><tr><th>${t('th_b2b')}</th><th>${t('th_net')}</th><th>${t('th_cash')}</th><th>${t('th_ben')}</th><th>${t('th_off')}</th><th>${t('th_cost')}</th></tr></thead><tbody>`+
    rows.map(Rm=>{const b=b2b(Rm),bc=baseForTotal(b.net,0,0,0),bw=baseForTotal(b.net,s.bonus,s.vac,s.hol),Pk=pkg(bw,s.bonus,s.vac,s.hol);
      return `<tr><td>${eur(Rm)}</td><td style="color:var(--b2b);font-weight:700">${eur(b.net)}</td><td>${eur(bc)}</td><td style="color:var(--emp);font-weight:700">${eur(bw)}</td><td style="color:var(--off)">+${eur(Pk.timeoff)}</td><td>${eur(Pk.cena)}</td></tr>`;}).join('')+'</tbody>';
  document.getElementById('tbl').innerHTML=h;
}

/* ===== theme: one button cycling auto → light → dark → auto =====
   "auto" is the ABSENCE of a choice, not a third stored value: it clears the
   key and the attribute so the stylesheet follows prefers-color-scheme again.
   The same contract, and the same key, as the landing page. */
function themeState(){return document.documentElement.getAttribute('data-theme')||'auto';}
function themeLabel(){
  const b=document.getElementById('theme'),st=themeState();
  const text=t('themeLabel')+': '+t('theme'+st.charAt(0).toUpperCase()+st.slice(1));
  b.setAttribute('title',text);b.setAttribute('aria-label',text);
}
document.getElementById('theme').addEventListener('click',()=>{
  const order=['auto','light','dark'],next=order[(order.indexOf(themeState())+1)%3];
  if(next==='auto'){document.documentElement.removeAttribute('data-theme');
    try{localStorage.removeItem('nls-theme');}catch(e){}}
  else{document.documentElement.setAttribute('data-theme',next);
    try{localStorage.setItem('nls-theme',next);}catch(e){}}
  themeLabel();
});

/* wiring */
document.getElementById('num').addEventListener('input',e=>{const v=+e.target.value||0;const r=document.getElementById('rng');r.value=Math.max(+r.min,Math.min(+r.max,v));update();});
document.getElementById('rng').addEventListener('input',e=>{document.getElementById('num').value=e.target.value;update();});
['bonus','vac','hol'].forEach(id=>document.getElementById(id).addEventListener('input',update));
document.querySelectorAll('#mode button').forEach(btn=>btn.addEventListener('click',()=>{
  document.querySelectorAll('#mode button').forEach(b=>b.classList.remove('on'));btn.classList.add('on');mode=btn.dataset.m;
  reconfig((+document.getElementById('num').value||0)*FACTOR[unit]);update();}));
document.querySelectorAll('#unit button').forEach(btn=>btn.addEventListener('click',()=>{
  const oldM=(+document.getElementById('num').value||0)*FACTOR[unit];unit=btn.dataset.u;reconfig(oldM);update();}));
document.querySelectorAll('#lang button').forEach(btn=>btn.addEventListener('click',()=>{
  lang=btn.dataset.l;
  /* Same key the landing page uses, and the same meaning: a language picked by
     hand is remembered across the domain. The site has four locales and this
     page has two, so only en/sk can be written from here. */
  try{localStorage.setItem('nls-lang',lang);}catch(e){}
  applyLang();}));

/* Initial language: a hand-picked preference first, then the browser's own
   order — the landing page's rule, narrowed to the two locales that exist here.
   Nothing is stored by detection alone. */
(function(){
  let saved=null;
  try{saved=localStorage.getItem('nls-lang');}catch(e){}
  if(saved==='en'||saved==='sk'){lang=saved;return;}
  if(saved)return;                                /* de / ru — English here */
  const pref=(navigator.languages&&navigator.languages.length)?navigator.languages:[navigator.language||''];
  for(const p of pref){const c=String(p||'').toLowerCase().split('-')[0];
    if(c==='en')break;
    if(c==='sk'){lang='sk';break;}}
})();

reconfig(8400);applyLang();
</script>
