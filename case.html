  <script>
    /* Theme. Identical control to the home page — see template.html for why it
       cycles rather than showing three buttons. Duplicated rather than shared
       because the site ships no JS bundle and two inline copies of twenty lines
       cost less than a build step that would have to exist to avoid them. */
    (function () {
      var button = document.getElementById('theme-toggle');
      if (!button) return;

      var ORDER = ['auto', 'light', 'dark'];

      function current() {
        return document.documentElement.getAttribute('data-theme') || 'auto';
      }

      function label() {
        var name = button.dataset['name' + current().charAt(0).toUpperCase() + current().slice(1)];
        var text = button.dataset.label + ': ' + name;
        button.setAttribute('title', text);
        button.setAttribute('aria-label', text);
      }

      button.addEventListener('click', function () {
        var next = ORDER[(ORDER.indexOf(current()) + 1) % ORDER.length];
        if (next === 'auto') {
          document.documentElement.removeAttribute('data-theme');
          try { localStorage.removeItem('nls-theme'); } catch (e) {}
        } else {
          document.documentElement.setAttribute('data-theme', next);
          try { localStorage.setItem('nls-theme', next); } catch (e) {}
        }
        label();
      });

      label();
    })();
  </script>
